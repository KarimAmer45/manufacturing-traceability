services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plating_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-plating_traceability}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
  migrate:
    image: flyway/flyway:11
    depends_on:
      db: {condition: service_healthy}
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-plating_traceability}
      FLYWAY_USER: ${POSTGRES_USER:-plating_admin}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    command: migrate
    volumes:
      - ./db/migrations:/flyway/sql:ro
  demo:
    build: .
    depends_on:
      migrate: {condition: service_completed_successfully}
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-plating_admin}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-plating_traceability}
    volumes:
      - ./docs/results:/app/docs/results
      - ./data:/app/data
volumes:
  pgdata:
